<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Pipo Mode - Oyun Yükleyici</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Oyun Yükleyici</h1>
        <input type="text" id="steamName" placeholder="Steam Kullanıcı Adını Gir">
        <button onclick="startLoading()">Enter</button>
        
        <div id="loadingArea" style="display:none;">
            <p id="status">50 adet oyun yükleniyor...</p>
            <div id="progressBar"><div id="progress"></div></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
